name: Release Container Image

# 仅由版本 tag 触发,避免每次 push 主分支都产出镜像、污染 latest。
# 发布流程: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - 'v*'
  # 手动触发:仅验证流水线能否构建成功,不推送镜像
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # 供 provenance 生成构建来源证明
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # GHCR 要求镜像路径全小写,仓库名含大写时会推送失败;此处统一归一化
      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # GITHUB_TOKEN 对 ghcr.io 自带 packages:write,无需配置任何 secret
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 由 tag 推导镜像 tag 与 OCI 标签:
      #   v1.0.0      → 1.0.0 / 1.0 / 1 / latest
      #   v1.0.0-rc.1 → 1.0.0-rc.1(预发布不覆盖 latest)
      #   手动触发    → dev(不推送)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=dev,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # 手动触发时只构建、不推送
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          # GitHub Actions 原生缓存,显著缩短二次构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
