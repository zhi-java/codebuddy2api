<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>上游凭证 · CodeBuddy Gateway</title>
<!--
  上游凭证（极简版）
  ─────────────────────────────────────────────────────────────
  这一页只回答一个问题：**凭证池够不够用、哪个坏了？**

  相对原控制台删掉的：
    · 「凭证材料」列（有 token / 有 refresh token 之类的布尔堆砌）——
      这些是录入时的一次性信息，日常运维不看
    · 每个凭证一行按钮 —— 收进行悬停浮现
    · 「类型 / 区域」拆成两列的宽表 —— 合并成名称下的一行次要信息

  保留：状态筛选（即统计）、搜索、额度抽屉、批量操作、每日签到开关。
-->
<link rel="stylesheet" href="shell.css" />
</head>
<body>
<div id="topbar"></div>

<main class="page">
  <div class="page-head">
    <div>
      <h1>上游凭证</h1>
      <p>网关按健康度调度，失败自动切换。凭证以加密形式落盘，不记录明文。</p>
    </div>
    <div class="page-actions">
      <div style="display:flex;align-items:center;gap:9px;margin-right:8px">
        <span class="sub">每日自动签到</span>
        <label class="switch"><input type="checkbox" id="auto-checkin" checked /><span></span></label>
      </div>
      <button class="btn btn-primary" id="btn-add">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
        添加凭证
      </button>
    </div>
  </div>

  <!-- 状态筛选：既是统计也是过滤器，用下划线表示选中 -->
  <div class="seg" id="filters" style="margin-bottom:22px">
    <button class="on" data-f="all">全部 <span class="n" id="n-all">6</span></button>
    <button data-f="healthy">健康 <span class="n" id="n-healthy">4</span></button>
    <button data-f="cooling">冷却中 <span class="n" id="n-cooling">1</span></button>
    <button data-f="disabled">已停用 <span class="n" id="n-disabled">1</span></button>
  </div>

  <!-- 搜索 + 批量操作 -->
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap">
    <div class="search" style="width:280px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input class="input" id="q" placeholder="搜索名称或 ID" />
    </div>
    <div id="batch" style="display:none;align-items:center;gap:10px">
      <span class="sub" id="batch-n">已选 0 个</span>
      <button class="btn btn-sm" data-batch="test">测试</button>
      <button class="btn btn-sm" data-batch="on">启用</button>
      <button class="btn btn-sm" data-batch="off">停用</button>
      <button class="btn-text" id="batch-clear">取消</button>
    </div>
  </div>

  <!-- 凭证表 -->
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:36px">
            <label class="check"><input type="checkbox" id="check-all" /><i></i></label>
          </th>
          <th>名称</th>
          <th>状态</th>
          <th style="width:200px">额度</th>
          <th>有效期</th>
          <th style="width:130px"></th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

  <div id="empty" class="empty" style="display:none">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg>
    <b>没有匹配的凭证</b>
    <span>换个关键词，或点「全部」清除筛选。</span>
  </div>
</main>

<!-- ══ 添加凭证 ══ -->
<div class="modal" id="m-add" role="dialog" aria-modal="true">
  <div class="modal-head">
    <h3>添加上游凭证</h3>
    <button class="close" data-close><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="modal-body">
    <div class="field">
      <label class="label" for="f-name">凭证名称</label>
      <input class="input" id="f-name" placeholder="例如：主账号 / 备用账号" />
    </div>
    <div class="field">
      <label class="label" for="f-kind">类型</label>
      <select class="select" id="f-kind">
        <option value="cli_oauth">CLI OAuth（支持自动刷新）</option>
        <option value="ck_apikey">ck_ 控制台 Key</option>
      </select>
    </div>
    <div class="field">
      <label class="label" for="f-region">区域</label>
      <select class="select" id="f-region">
        <option value="cn">国内版</option>
        <option value="intl">国际版</option>
      </select>
      <div class="field-hint">国内版与国际版的登录地址、接口与鉴权方式均不同，区域配错会导致请求被拒。</div>
    </div>
    <div class="field">
      <label class="label" for="f-token">accessToken</label>
      <textarea class="textarea mono" id="f-token" placeholder="eyJhbGci…"></textarea>
    </div>
    <div class="field">
      <label class="label" for="f-refresh">refreshToken（可选，用于自动刷新）</label>
      <textarea class="textarea mono" id="f-refresh" placeholder="eyJhbGci…"></textarea>
    </div>
  </div>
  <div class="modal-foot">
    <button class="btn" data-close>取消</button>
    <button class="btn btn-primary" id="f-save">保存</button>
  </div>
</div>

<!-- ══ 额度抽屉 ══ -->
<div class="drawer" id="d-quota" role="dialog" aria-modal="true">
  <div class="drawer-head">
    <h3 id="quota-title">额度</h3>
    <button class="close" data-close><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-body" id="quota-body"></div>
</div>

<!-- ══ 签到状态抽屉 ══ -->
<div class="drawer" id="d-checkin" role="dialog" aria-modal="true">
  <div class="drawer-head">
    <h3 id="checkin-title">签到状态</h3>
    <button class="close" data-close><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="drawer-body" id="checkin-body"></div>
</div>

<script src="shared.js"></script>
<script>
mountTopbar('credentials');

/* ═══════════ 数据 ═══════════ */
const CREDS = [
  { id:'cred_7f3a91', name:'cli-main',   kind:'cli_oauth', region:'cn',   status:'healthy',  enabled:true,  used:9200, total:10000, expires:'3 天 4 小时' },
  { id:'cred_2b8c44', name:'cli-backup', kind:'cli_oauth', region:'cn',   status:'healthy',  enabled:true,  used:6100, total:10000, expires:'5 天 11 小时' },
  { id:'cred_9d1e07', name:'ck-team',    kind:'ck_apikey', region:'cn',   status:'healthy',  enabled:true,  used:3860, total:10000, expires:'长期有效' },
  { id:'cred_4a62f8', name:'ck-lite',    kind:'ck_apikey', region:'intl', status:'healthy',  enabled:true,  used:2740, total:10000, expires:'长期有效' },
  { id:'cred_6e05b3', name:'cli-dev',    kind:'cli_oauth', region:'cn',   status:'cooling',  enabled:true,  used:8800, total:10000, expires:'1 天 2 小时' },
  { id:'cred_1c93aa', name:'cli-old',    kind:'cli_oauth', region:'cn',   status:'disabled', enabled:false, used:10000, total:10000, expires:'已过期' },
];

const STATUS_CN = { healthy:'健康', cooling:'冷却中', disabled:'已停用' };
const STATUS_DOT = { healthy:'var(--ok)', cooling:'var(--warn)', disabled:'var(--text-3)' };

/* ═══════════ 状态 ═══════════ */
let filter = 'all';
let query = '';
let selected = new Set();

function visible() {
  return CREDS.filter((c) => {
    if (filter !== 'all' && c.status !== filter) return false;
    if (query) {
      const q = query.toLowerCase();
      if (!c.name.toLowerCase().includes(q) && !c.id.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

/* ═══════════ 渲染 ═══════════ */
function render() {
  const rows = visible();
  const tbody = document.getElementById('rows');
  const emptyEl = document.getElementById('empty');

  if (!rows.length) {
    tbody.innerHTML = '';
    emptyEl.style.display = 'flex';
  } else {
    emptyEl.style.display = 'none';
    tbody.innerHTML = rows.map((c) => {
      const pct = Math.round((c.used / c.total) * 100);
      const left = c.total - c.used;
      // 额度条：低余量用文字色提示，不用彩色底
      const tone = pct >= 95 ? 'var(--bad)' : pct >= 85 ? 'var(--warn)' : 'var(--text-3)';
      return `<tr data-id="${c.id}">
        <td>
          <label class="check"><input type="checkbox" data-pick="${c.id}" ${selected.has(c.id) ? 'checked' : ''} /><i></i></label>
        </td>
        <td>
          <div class="cell-main">${c.name}</div>
          <div class="cell-sub"><span class="kind">${c.kind}</span> · ${c.region === 'cn' ? '国内版' : '国际版'}</div>
        </td>
        <td><span class="st ${c.status === 'healthy' ? 'ok' : c.status === 'cooling' ? 'warn' : ''}"><i style="background:${STATUS_DOT[c.status]}"></i>${STATUS_CN[c.status]}</span></td>
        <td>
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px">
            <span class="mono" style="font-size:12px">${left.toLocaleString()} 剩余</span>
            <span class="sub mono">${pct}%</span>
          </div>
          <div style="height:2px;background:var(--line)"><i style="display:block;height:100%;width:${pct}%;background:${tone}"></i></div>
        </td>
        <td><span class="mono" style="font-size:12px">${c.expires}</span></td>
        <td>
          <div class="row-acts">
            <button class="btn-text" data-act="quota">额度</button>
            <button class="btn-text" data-act="checkin">签到</button>
            <button class="btn-text" data-act="test">测试</button>
            <button class="btn-text" data-act="toggle">${c.enabled ? '停用' : '启用'}</button>
          </div>
        </td>
      </tr>`;
    }).join('');
  }

  // 计数
  document.getElementById('n-all').textContent = CREDS.length;
  document.getElementById('n-healthy').textContent = CREDS.filter((c) => c.status === 'healthy').length;
  document.getElementById('n-cooling').textContent = CREDS.filter((c) => c.status === 'cooling').length;
  document.getElementById('n-disabled').textContent = CREDS.filter((c) => c.status === 'disabled').length;

  // 批量条
  const batch = document.getElementById('batch');
  batch.style.display = selected.size ? 'flex' : 'none';
  document.getElementById('batch-n').textContent = `已选 ${selected.size} 个`;
  document.getElementById('check-all').checked = rows.length > 0 && rows.every((r) => selected.has(r.id));
}

/* ═══════════ 交互 ═══════════ */
document.getElementById('filters').addEventListener('click', (e) => {
  const b = e.target.closest('[data-f]');
  if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#filters button').forEach((x) => x.classList.toggle('on', x === b));
  render();
});

document.getElementById('q').addEventListener('input', (e) => {
  query = e.target.value.trim();
  render();
});

document.getElementById('check-all').addEventListener('change', (e) => {
  const rows = visible();
  if (e.target.checked) rows.forEach((r) => selected.add(r.id));
  else rows.forEach((r) => selected.delete(r.id));
  render();
});

document.getElementById('rows').addEventListener('change', (e) => {
  const id = e.target.dataset.pick;
  if (!id) return;
  if (e.target.checked) selected.add(id); else selected.delete(id);
  render();
});

document.getElementById('batch-clear').addEventListener('click', () => { selected.clear(); render(); });

document.getElementById('batch').addEventListener('click', (e) => {
  const b = e.target.closest('[data-batch]');
  if (!b) return;
  const n = selected.size;
  if (b.dataset.batch === 'on' || b.dataset.batch === 'off') {
    const on = b.dataset.batch === 'on';
    CREDS.forEach((c) => {
      if (selected.has(c.id)) { c.enabled = on; c.status = on ? 'healthy' : 'disabled'; }
    });
  }
  toast(`${n} 个凭证已${b.textContent.trim()}`);
  selected.clear();
  render();
});

/* 行内操作 */
document.getElementById('rows').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const id = btn.closest('tr').dataset.id;
  const c = CREDS.find((x) => x.id === id);
  if (!c) return;

  switch (btn.dataset.act) {
    case 'quota': openQuota(c); break;
    case 'checkin': openCheckin(c); break;
    case 'test': btn.textContent = '测试中…'; setTimeout(() => { btn.textContent = '412ms'; setTimeout(() => render(), 900); }, 700); break;
    case 'toggle':
      c.enabled = !c.enabled;
      c.status = c.enabled ? 'healthy' : 'disabled';
      render();
      break;
  }
});

/* ── 额度抽屉 ── */
function openQuota(c) {
  const pct = Math.round((c.used / c.total) * 100);
  document.getElementById('quota-title').textContent = `额度 · ${c.name}`;
  document.getElementById('quota-body').innerHTML = `
    <div style="margin-bottom:24px">
      <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">
        <div>
          <div class="label">剩余</div>
          <div style="font-size:26px;font-weight:600;letter-spacing:-.03em" class="tnum">${(c.total - c.used).toLocaleString()}</div>
        </div>
        <span class="sub mono">已用 ${pct}%</span>
      </div>
      <div style="height:2px;background:var(--line)"><i style="display:block;height:100%;width:${pct}%;background:${pct >= 85 ? 'var(--warn)' : 'var(--text)'}"></i></div>
    </div>
    <ul class="kv">
      <li><span class="k">总量</span><span class="v mono">${c.total.toLocaleString()}</span></li>
      <li><span class="k">已用</span><span class="v mono">${c.used.toLocaleString()}</span></li>
      <li><span class="k">计费周期</span><span class="v mono">2026-10-01 ~ 2026-10-15</span></li>
      <li><span class="k">资源 ID</span><span class="v mono">${c.id}</span></li>
      <li><span class="k">查询时间</span><span class="v mono">${fmt.time(Date.now())}</span></li>
    </ul>`;
  Overlay.open('d-quota');
}

/* ── 签到抽屉 ── */
function openCheckin(c) {
  document.getElementById('checkin-title').textContent = `签到状态 · ${c.name}`;
  if (c.kind === 'ck_apikey') {
    document.getElementById('checkin-body').innerHTML = `
      <div class="note">该凭证为 ck_ 控制台 Key，只能查询签到状态、无法执行领取。如需领取请改用 CLI OAuth 形态的凭证。</div>
      <ul class="kv" style="margin-top:22px">
        <li><span class="k">活动</span><span class="v">第 8 期 · 开学季</span></li>
        <li><span class="k">今日状态</span><span class="v">未领取</span></li>
        <li><span class="k">每日额度</span><span class="v mono">100 credits</span></li>
      </ul>`;
  } else {
    document.getElementById('checkin-body').innerHTML = `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:22px">
        <span class="st ok"><i></i>活动进行中</span>
        <span class="sub">第 8 期 · 开学季</span>
      </div>
      <ul class="kv">
        <li><span class="k">今日状态</span><span class="v">已领取 +100</span></li>
        <li><span class="k">每日额度</span><span class="v mono">100 credits</span></li>
        <li><span class="k">连续签到</span><span class="v mono">12 天</span></li>
        <li><span class="k">本期累计</span><span class="v mono">1,200 credits</span></li>
        <li><span class="k">本期档期</span><span class="v mono">2026-09-01 ~ 2026-09-15</span></li>
        <li><span class="k">剩余</span><span class="v mono">3 天</span></li>
      </ul>
      <button class="btn" style="margin-top:22px;width:100%;justify-content:center" id="do-checkin">立即签到</button>`;
    document.getElementById('do-checkin')?.addEventListener('click', () => {
      toast('签到成功，+100 credits');
      Overlay.close();
    });
  }
  Overlay.open('d-checkin');
}

/* ── 添加凭证 ── */
document.getElementById('btn-add').addEventListener('click', () => Overlay.open('m-add'));
document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => Overlay.close()));

document.getElementById('f-save').addEventListener('click', () => {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('请填写凭证名称'); return; }
  CREDS.unshift({
    id: 'cred_' + Math.random().toString(16).slice(2, 8),
    name,
    kind: document.getElementById('f-kind').value,
    region: document.getElementById('f-region').value,
    status: 'healthy', enabled: true,
    used: 0, total: 10000, expires: '—',
  });
  Overlay.close();
  document.getElementById('f-name').value = '';
  document.getElementById('f-token').value = '';
  document.getElementById('f-refresh').value = '';
  filter = 'all'; query = '';
  document.getElementById('q').value = '';
  document.querySelectorAll('#filters button').forEach((x) => x.classList.toggle('on', x.dataset.f === 'all'));
  render();
  toast(`已添加「${name}」`);
});

/* ── 签到开关 ── */
document.getElementById('auto-checkin').addEventListener('change', (e) => {
  toast(e.target.checked ? '已开启每日自动签到' : '已关闭每日自动签到');
});

render();
</script>
</body>
</html>
